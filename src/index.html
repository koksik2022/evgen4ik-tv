<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evgen4ik TV — редактор плейлистов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f59e0b'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-weight='800' font-size='14' fill='%2318181b'%3EE4%3C/text%3E%3C/svg%3E">
<style>
/* Оформление в духе m3u-editor (Filament): боковое меню, карточки, таблицы. Тёмная тема по умолчанию, светлая — по настройке системы. */
:root{
  --bg:#09090b; --side:#0c0c0f; --panel:#18181b; --panel2:#1f1f23; --ink:#fafafa; --muted:#a1a1aa; --line:rgba(255,255,255,.09);
  --hover:rgba(255,255,255,.05); --accent:#f59e0b; --accent-ink:#18181b; --accent-soft:rgba(245,158,11,.12);
  --sel:rgba(245,158,11,.10); --hid:#62626b; --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --warn:#fbbf24; --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
  --in:rgba(74,222,128,.08); --ring:rgba(255,255,255,.12);
  --f:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; --mono:Consolas,"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f9fafb; --side:#ffffff; --panel:#ffffff; --panel2:#f4f4f5; --ink:#18181b; --muted:#71717a; --line:#e4e4e7;
  --hover:#f4f4f5; --accent:#d97706; --accent-ink:#ffffff; --accent-soft:#fef3c7; --sel:#fffbeb; --hid:#a1a1aa;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#b45309; --bad:#dc2626; --bad-soft:#fee2e2; --in:#f0fdf4; --ring:#e4e4e7; color-scheme:light}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);display:flex}
a{color:inherit}
/* боковое меню */
.sidebar{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px;font-weight:700;font-size:16px;letter-spacing:.01em}
.brand{font-size:18px;font-weight:750;letter-spacing:-.01em}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:800;letter-spacing:0;flex:none}
.brand .tv{color:var(--accent)}
.nav{padding:4px 12px 16px;overflow:auto;flex:1}
.nav h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:16px 10px 6px}
.nav button{box-shadow:none;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;text-align:left}
.nav button svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button.on svg{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:11.5px;padding:0 7px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.sidefoot{padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
/* страница */
.page{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:auto}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;padding:18px 28px 14px}
.titles{min-width:0}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.crumbs button{box-shadow:none;border:0;background:none;color:var(--muted);padding:0;font:inherit;cursor:pointer}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
.stats{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:3px}
.stats b{color:var(--ink)}
.sp{flex:1}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--ring);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.15)}
button:hover{background:var(--panel2)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
button.icon{padding:3px 7px;border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
button.icon:hover{background:var(--hover);color:var(--ink)}
button.sm{padding:3px 9px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=search],input[type=number],select,textarea{font:inherit;border:1px solid var(--ring);border-radius:8px;padding:6px 10px;background:var(--panel);color:var(--ink)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
textarea{font:12.5px/1.5 var(--mono);width:100%;resize:vertical}
.dirty{color:var(--warn);font-weight:600;font-size:12.5px}
.muted{color:var(--muted);font-size:12.5px}
/* карточки, формы */
.content{flex:1;min-height:0;overflow:auto;padding:0 28px 28px;display:flex;flex-direction:column;gap:18px}
.card{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.card h2{font-size:15px;margin:0 0 4px;font-weight:650}
.card .hint,.hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12.5px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch i{width:36px;height:20px;border-radius:999px;background:var(--panel2);border:1px solid var(--ring);position:relative;transition:.15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.15s}
.switch input:checked+i{background:var(--accent);border-color:var(--accent)}
.switch input:checked+i:after{left:18px;background:var(--accent-ink)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--accent-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.lmo-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.lmo{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;position:relative}
.lmo:hover{border-color:var(--accent)}.lmo.on{border-color:var(--accent);background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}
.lmo.off{opacity:.5;cursor:not-allowed}.lmo b{font-size:14px}.lmo:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.lmt{display:flex;gap:4px;flex-wrap:wrap}
.lmr{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.lmn{padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lmn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.lmn.wn{border-style:dashed}
.lma{color:var(--muted)}
.sr{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.hq{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;margin-left:6px;border-radius:50%;font-size:12px;font-weight:600;color:var(--muted);vertical-align:middle;box-shadow:none}
.hq:hover{color:var(--accent);border-color:var(--accent)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.hterm{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.5}
.hterm b{font-size:14px}
.hhow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.hhow summary{cursor:pointer;font-weight:600}.hhow ol{margin:8px 0 2px;padding-left:20px;color:var(--muted);line-height:1.7;font-size:13px}
button.badge{cursor:pointer;box-shadow:none;font:inherit;font-size:11.5px;font-weight:600}button.badge.blink:hover{border-color:var(--accent);color:var(--accent)}
/* таблица */
.tcard{padding:0;overflow:hidden}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:600;text-align:left;padding:10px 14px;color:var(--ink);background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--hover)}
.tbl td.num{font-variant-numeric:tabular-nums}
.tbl .acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.tbl td.nw{white-space:nowrap}
.tbl .name{text-align:left;font-weight:600;cursor:pointer;border:0;background:none;padding:0;box-shadow:none;color:var(--ink)}
.tbl .name:hover{color:var(--accent);background:none}
.twrap{overflow:auto}
.empty{padding:40px 20px;color:var(--muted);text-align:center}
.ktiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;flex:none}
.ktile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ktile b{display:block;font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.ktile.ok b{color:var(--ok)}.ktile.warn{border-color:var(--warn)}.ktile.warn b{color:var(--warn)}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border-radius:999px}.pill.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cf{display:flex;flex-direction:column;gap:4px;margin-top:10px}.cf label{font-size:12.5px;color:var(--muted)}
.clists{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.clist{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;box-shadow:none}
.clist.on{border-color:var(--accent);background:var(--sel)}
.cmsg{white-space:pre-line;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px}
.cbars{display:flex;align-items:flex-end;gap:8px;height:96px}
.cbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11.5px;color:var(--muted)}
.cbar i{display:block;width:100%;max-width:44px;border-radius:5px 5px 2px 2px;background:var(--accent)}.cbar i.z{background:var(--panel2)}
.drag{cursor:grab;color:var(--muted);font-size:16px;user-select:none;padding:4px}.drag:hover{color:var(--accent)}
tr.dropb td{box-shadow:inset 0 2px 0 var(--accent)}
/* редактор групп/каналов */
.lbar{display:flex;flex-direction:column;gap:14px;padding:0 28px 14px}
main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:520px;margin:0 28px 20px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.groups{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.gtools{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.gtools input{flex:1;min-width:0}
.glist{overflow:auto;flex:1}
.g{display:flex;align-items:center;gap:6px;padding:7px 10px 7px 6px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.g:hover{background:var(--hover)}
.g.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.g.hidden .gname{color:var(--hid);text-decoration:line-through}
.g.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.grip{cursor:grab;color:var(--muted);padding:0 4px}
.gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname small{display:block;color:var(--muted);font-size:11px}
.cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
main.three{grid-template-columns:270px minmax(0,1fr) minmax(300px,380px)}
.mine{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.mine .ptools{background:var(--accent-soft)}
.m{display:grid;grid-template-columns:18px 30px 1fr auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);cursor:grab}
.m:hover{background:var(--hover)} .m.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.m img{width:30px;height:20px;object-fit:contain;background:rgba(127,127,127,.12);border-radius:4px}
.m .num{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right}
.m.pend .cn{color:var(--warn)}
#srcbar{flex-direction:column;align-items:stretch}
#srcbar select{width:100%}
.ptools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ptools .title{font-weight:650;font-size:15px}
.ptools input[type=search]{width:240px;max-width:100%}
.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 14px;background:var(--sel);border-bottom:1px solid var(--line)}
.clist{overflow:auto;flex:1}
.c{display:grid;grid-template-columns:22px 34px 1fr auto auto auto auto auto;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line)}
.c.lm{grid-template-columns:22px 34px 1fr auto}
.icon.play,.icon.pvplay{color:var(--accent);font-size:13px}
.plbox{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:60;padding:16px}
.plwin{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(880px,100%);max-height:100%;overflow:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.plhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.plhead b{font-size:16px;margin-right:auto}
#plV{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;display:block}
.plst{margin-top:8px;font-size:13px;color:var(--muted);min-height:18px}.plst.bad{color:var(--bad)}
.plinfo{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px;line-height:1.55}
.c.lm.in{background:var(--in)}
.c.lm.off{opacity:.55}
.c:hover{background:var(--hover)}
.c.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.c[draggable=true]{cursor:grab}
.c.hidden .cn{color:var(--hid);text-decoration:line-through}
.c img{width:34px;height:22px;object-fit:contain;background:rgba(127,127,127,.12);border-radius:4px}
.cn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn small{color:var(--muted);font-size:11.5px;margin-left:6px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-left:4px;background:var(--panel2)}
.mod{color:var(--accent);font-size:11px;margin-left:6px}
.c select{max-width:180px}
.ued,.addf{padding:12px 14px 14px 78px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:8px}
.addf{padding-left:14px;flex-direction:row;flex-wrap:wrap;align-items:center}
.addf input{flex:1 1 200px}
.uhint{color:var(--muted);font-size:12.5px}
.uorig{font:12px var(--mono);color:var(--muted);display:flex;flex-direction:column;gap:2px;word-break:break-all}
.ubtns{display:flex;gap:6px;flex-wrap:wrap}
.ufields{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;align-items:center;max-width:900px}
.ufields label{color:var(--muted);font-size:12.5px}
.chk-res{font:12px var(--mono);display:flex;flex-direction:column;gap:2px}
.log{font:12px var(--mono);white-space:pre-wrap;color:var(--muted);max-height:160px;overflow:auto;padding:8px 14px;border-top:1px solid var(--line)}
.st-ok{color:var(--ok)} .st-run{color:var(--warn)} .st-bad{color:var(--bad)}
.srow{display:grid;grid-template-columns:80px 150px minmax(120px,1fr) auto auto auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .st{color:var(--muted);font-size:12px}
.srcfbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;margin:0 28px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent);font-size:14px}
.pvgrid{display:grid;grid-template-columns:230px 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:min(52vh,460px)}
.pvgrid>div{overflow:auto}.pvg{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.pvg:hover{background:var(--hover)}.pvg.on{background:var(--sel);color:var(--accent);font-weight:600}
.pvc{display:grid;grid-template-columns:30px 1fr auto auto;
gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.pvedit{padding:10px 12px 12px 52px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:8px}
.pvc img,.pvc .nl{width:30px;height:30px;object-fit:contain;border-radius:6px}
.pvwarn{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--bad-soft);font-size:13px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ring);border-radius:8px;padding:2px 4px 2px 10px;font-size:13px;background:var(--panel2)}
.psec{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 8px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ptile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);box-shadow:none;min-height:96px}
.ptile:hover{border-color:var(--accent)} .ptile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)} .ptile.dis{cursor:default}
.ptile b{font-size:13.5px} .ptile>span:last-child{font-size:11.5px;color:var(--muted)}
.plg{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;overflow:hidden;flex:none;position:relative}
.plg svg{display:block}
.plg .pfav{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:4px;box-sizing:border-box}
.plink{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer} .plink:hover{filter:brightness(1.2)}
.sfav{width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:4px;background:#fff;object-fit:contain}
ol.steps{margin:6px 0 0 18px;padding:0;color:var(--muted);font-size:12.5px;line-height:1.7}
.srcs{display:flex;flex-wrap:wrap;gap:6px 14px}
.linkrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.linkrow input{flex:1 1 320px;font:12.5px var(--mono)}
.warnbar{margin:0 28px 14px;padding:10px 14px;border-radius:10px;background:var(--bad-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.warnbar b{color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:min(92vw,440px);text-align:center}
.mbox svg{background:#fff;border-radius:8px;max-width:100%;height:auto}
.mbox code{display:block;word-break:break-all;margin-top:8px;font-size:12px;color:var(--muted)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;z-index:9}
.toast.on{opacity:.96}
/* боковая панель: состояние, быстрые кнопки, поиск Ctrl+K (17.11.2026) */
.sbst{margin:0 12px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12px;line-height:1.75;cursor:pointer}
.sbst:hover{border-color:var(--ring)}
.sbst div{display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.sbq{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 12px 2px}
.sbq button{font-size:12px;padding:5px 6px;box-shadow:none;white-space:nowrap}
.nav .cnt.warn{background:var(--accent-soft);color:var(--warn)}.nav .cnt.bad{background:var(--bad-soft);color:var(--bad)}.nav .cnt.ok{background:var(--ok-soft);color:var(--ok)}
.nav .cnt:empty{display:none}
.httpbar{margin:0 28px 14px;padding:10px 14px;border-radius:10px;background:var(--bad-soft);border:1px solid var(--bad);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.httpbar b{color:var(--bad)}
@keyframes e4pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}50%{box-shadow:0 0 0 5px rgba(245,158,11,0)}}
button.pulse{animation:e4pulse 1.8s infinite}
.kbox{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.kwin{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:72vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.kwin input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:15px;outline:none}
.klist{overflow:auto;flex:1}
.ki{display:flex;gap:10px;align-items:center;padding:8px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.ki:hover,.ki.on{background:var(--sel)}
.ki .kt{font-size:11px;color:var(--muted);width:72px;flex:none}
.ki .kl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ki .ks{font-size:12px;color:var(--muted);white-space:nowrap}
.alist{display:flex;flex-direction:column}
.aitem{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.aitem:last-child{border-bottom:0}
.aitem span.t{flex:1;min-width:200px}
pre.jlog{font:12px/1.55 var(--mono);white-space:pre-wrap;color:var(--muted);margin:0;max-height:340px;overflow:auto}
@media (max-width:900px){
  .sbst,.sbq{margin:0 10px 8px}.sbq{grid-template-columns:repeat(4,1fr)}.httpbar{margin:0 16px 12px}
  /* телефон: страница прокручивается целиком (раньше содержимое было в маленьком окошке под меню) */
  html,body{height:auto}.content{overflow:visible;flex:none}.page{overflow:visible}
  .sbst{display:flex;flex-wrap:wrap;gap:0 14px;line-height:1.6}.sbst div{flex:none}
  .brand{padding:12px 16px}.nav button{padding:6px 8px}.sidefoot{padding:8px 16px}
  body{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 10px}.nav h3{display:none}.nav button{width:auto}
  .page{height:auto;min-height:0}
  .topbar,.content,.lbar{padding-left:16px;padding-right:16px}
  main,main.three{margin:0 16px 16px;grid-template-columns:1fr;grid-template-rows:40vh 1fr;min-height:80vh}
  .mine{border-left:0;border-top:1px solid var(--line);min-height:50vh}
  .groups{border-right:0;border-bottom:1px solid var(--line)}
  .c{grid-template-columns:22px 28px 1fr auto auto}.c .mv,.c .ren{display:none}.ued{padding-left:14px}
  .srow{grid-template-columns:1fr 1fr}.srcfbar{margin:0 16px 12px}.pvgrid{grid-template-columns:1fr;height:auto}.pvgrid>div:first-child{max-height:150px}.ufields{grid-template-columns:1fr}
}
</style>
</head>

<script>
"use strict";
let srcF=null; const inSrcF=c=>!srcF||(c.msrc||c.src||[]).includes(srcF);   // фильтр «только этот источник» в «Группах и каналах»
let lsrc="main", xsel=null, EXT={}, flt="", mergeOpen=false, undoStack=[], lastSnap=null, ALIAS={}, AR=[];
let frOpen=false, frState={f:"",r:"",rx:false}, chkRes={}, chkState={total:0,done:0,ok:0,bad:0,stop:false};

const URLRX=/^(https?|rtmp|rtsp|udp|rtp):\/\/[^\s"]{1,2000}$/i;
let EPG_URL="", CONF={}, booted=false;
let STATUS=null;   // последний ответ /api/status (сборка, HLS Proxy, автопроверка) — для боковой панели, «Обзора» и «Журнала»

  const hw="";   // предупреждение про http теперь заметной плашкой над страницей (#httpbar), а не мелким текстом здесь

  VER.updating=true; showVer(); const was=VER.current, t0=Date.now(); clearInterval(verPoll);

    catch(e){/* редактор перезапускается */}},5000)});

function norm(r){r=r||{};return{version:1,hidden_patterns:r.hidden_patterns||(ST&&ST.default_hidden)||[],groups:r.groups||{},channels:r.channels||{},
  group_order:r.group_order||[],custom_groups:r.custom_groups||[],custom_channels:r.custom_channels||[],lists:r.lists||[],
  sources:r.sources||[],disabled_sources:r.disabled_sources||[],primary_source:r.primary_source||null,stream_limit:r.stream_limit??null,stream_limit_mode:r.stream_limit_mode==="auto"?"auto":"manual",
  lists_only_sources:r.lists_only_sources||[],channel_order:r.channel_order||{},auto_rules:r.auto_rules||[],free_sources:r.free_sources||[],free_edits:r.free_edits||{},clients:r.clients||[],client_msg:r.client_msg||""}}
function isDirty(){return JSON.stringify(R)!==saved}

      <button id="lSlugGen" title="Придумать из названия">Предложить</button>${L.slug&&savedL&&savedL.slug===L.slug?`<button id="lCopyS">Копировать</button><button id="lQrS">QR</button>`:L.slug?'<span class="muted">заработает после сохранения</span>':""}</div>

function renderGroups(){
  const gs=groupsOrdered(), L=mode==="lists"?LL():null;
  $("glist").innerHTML=gs.map((g,i)=>{const ch=mode==="main"&&srcF?chansOf(g).filter(inSrcF):chansOf(g),v=ch.filter(c=>!chHidden(c)).length,h=groupHidden(g);
    if(mode==="main"&&srcF&&!ch.length) return "";
    const lc=L?`<input type="checkbox" class="gin" ${h?"disabled":""} title="${h?"Группа скрыта в основном плейлисте":"Вся группа в плейлисте"}" data-st="${h?0:groupState(L,g)}">`:"";
    return `<div class="g${g===sel?" sel":""}${h?" hidden":""}" draggable="${mode==="main"}" data-g="${esc(g)}" data-i="${i}">
      ${L?lc:`<span class="grip" title="Перетащите, чтобы изменить порядок">⋮⋮</span>`}
      <span class="gname">${esc(dispG(g))}${grRule(g).rename?`<small>было: ${esc(g)}</small>`:""}</span>
      <span class="cnt">${h?"скрыта":L?ch.filter(c=>member(L,c)).length+"/"+ch.filter(c=>visMain(c)&&srcOk(L,c)).length:v+(v!==ch.length?"/"+ch.length:"")}</span>
      ${mode==="main"?`<button class="icon" data-act="up" title="Выше">▲</button><button class="icon" data-act="down" title="Ниже">▼</button>
      <button class="icon" data-act="eye" title="${h?"Показать группу":"Скрыть группу"}">${h?"🚫":"👁"}</button>`:""}</div>`}).join("");
  document.querySelectorAll(".gin").forEach(x=>{const s=+x.dataset.st;x.checked=s===2;x.indeterminate=s===1});
}
const normName=n=>n.toLowerCase().replace(/\b(hd|fhd|uhd|sd|4k|8k|orig|original|premium|hevc|h265|h264|50|\+1|\+2|\+4|\+7)\b/g," ").replace(/[^a-zа-яё0-9]+/g," ").replace(/\s+/g," ").trim();
const FLT={"":"Все каналы",dead:"Не отвечают (автопроверка)",noepg:"Без программы (EPG)",nologo:"Без логотипа",edited:"С моими правками",hidden:"Скрытые",merged:"Склеенные",similar:"Похожие названия"};
function fltList(){let l;
  if(flt==="dead") l=ALL.filter(c=>!c.alias&&acDeadOf(c));
  else if(flt==="noepg") l=ALL.filter(c=>visMain(c)&&!c.id&&!chRule(c.k).tvg_id&&!(c.custom&&R.custom_channels[c.ci].tvg_id));
  else if(flt==="nologo") l=ALL.filter(c=>visMain(c)&&!logoOf(c));
  else if(flt==="edited") l=ALL.filter(c=>R.channels[c.k]&&Object.keys(R.channels[c.k]).length);
  else if(flt==="hidden") l=ALL.filter(c=>!c.alias&&!visMain(c));
  else if(flt==="merged") l=ALL.filter(c=>c.alias||c.msrc);
  else if(flt==="similar"){const m=new Map(); for(const c of ALL){if(c.alias||!visMain(c)) continue; const n=normName(dispName(c)); if(!n) continue; if(!m.has(n)) m.set(n,[]); m.get(n).push(c)}
    l=[...m.entries()].filter(x=>x[1].length>1).sort((a,b)=>a[0].localeCompare(b[0],"ru")).flatMap(x=>x[1])}
  else l=ALL;
  if(q) l=l.filter(c=>(c.n+" "+dispName(c)).toLowerCase().includes(q));
  return l}
function paneList(){
  let list;
  if(flt&&mode==="main") list=fltList(); else if(q) list=ALL.filter(c=>(c.n+" "+dispName(c)).toLowerCase().includes(q));
  else if(sel){list=chansOf(sel); const o=R.channel_order[sel]; if(o&&o.length){const ix=new Map(o.map((k,i)=>[k,i])); list=list.map((c,i)=>[c,i]).sort((a,b)=>((ix.has(a[0].k)?ix.get(a[0].k):1e6+a[1])-(ix.has(b[0].k)?ix.get(b[0].k):1e6+b[1]))).map(x=>x[0])}}
  else list=[];
  if(mode==="lists") list=list.filter(c=>visMain(c)||showHidden);
  else if(!showHidden) list=list.filter(c=>!chHidden(c));
  if(mode==="main"&&srcF) list=list.filter(inSrcF);
  return list;
}
function renderPane(){
  const gs=groupsOrdered(), L=mode==="lists"?LL():null;
  const opts=gs.map(g=>`<option value="${esc(g)}">${esc(dispG(g))}</option>`).join("");
  const list=paneList();
  const gh=sel&&groupHidden(sel);
  let tools;
  if(mode==="lists") tools=(q?`<span class="title">Поиск: «${esc(q)}» — ${list.length}</span>`:sel?`<span class="title">${esc(dispG(sel))}</span>`:"")
      +(L&&list.length?`<button id="lAddAll">Добавить в плейлист все показанные</button><button id="lRemAll">Убрать показанные</button>`:"");
  else tools=q?`<span class="title">Поиск: «${esc(q)}» — ${list.length}</span>`:sel?`<input type="text" id="gRename" value="${esc(dispG(sel))}" maxlength="80" title="Название группы в плейлисте" style="font-weight:650;width:260px">
      <button id="gEye">${gh?"Показать группу":"Скрыть группу"}</button>${grRule(sel).rename?`<button id="gUnrename" title="Вернуть исходное название «${esc(sel)}»">↺ название</button>`:""}
      <button id="gAddCh" title="Добавить свой канал со своей ссылкой в эту группу">+ Канал</button>
      <button id="gSort" title="Расставить каналы группы по алфавиту">А→Я</button>${R.channel_order[sel]?`<button id="gUnsort" title="Вернуть порядок каналов как у источника">↺ порядок</button>`:""}`:"";
  if(mode==="main") tools=(flt?`<span class="title">${esc(FLT[flt])} — ${list.length}</span>`:tools)+`<select id="fltSel" title="Фильтр каналов по всем группам">${Object.entries(FLT).map(([k,v])=>`<option value="${k}"${k===flt?" selected":""}>${v}</option>`).join("")}</select>`
    +(allSources().length>1||srcF?`<select id="srcSel" title="Показать каналы одного источника"><option value="">Все источники</option>${allSources().map(n=>`<option value="${esc(n)}"${n===srcF?" selected":""}>Источник: ${esc(n)}</option>`).join("")}</select>`:"");
  if(mode==="main"&&list.length) tools+=`<button id="gCheck" title="Проверить, отвечают ли потоки (первая ссылка каждого канала)">Проверить потоки</button><button id="gFr" title="Найти и заменить текст в названиях">Найти/заменить</button>`;
  $("ptools").innerHTML=tools+`<span class="sp"></span><label><input type="checkbox" id="showHidden" ${showHidden?"checked":""}> скрытые</label>
      <input type="search" id="q" placeholder="Поиск канала во всех группах" value="${esc(q)}">`;
  let html="";
  if(mode==="main"&&addOpen&&sel&&!q) html+=`<div class="addf"><b>Свой канал в «${esc(dispG(sel))}»</b>
      <input type="text" id="acName" placeholder="Название канала" maxlength="100">
      <input type="text" id="acUrl" placeholder="Ссылка на поток: https://…/index.m3u8" spellcheck="false">
      <input type="text" id="acLogo" placeholder="Логотип (ссылка, необязательно)" spellcheck="false">
      <button id="acOk" class="primary">Добавить</button><button id="acCancel">Отмена</button></div>`;
  if(mode==="main"&&frOpen) html+=`<div class="addf"><b>Найти и заменить в названиях</b> <span class="muted">(${checked.size?"у выбранных: "+checked.size:"у показанных: "+list.length})</span>
      <input type="text" id="frFind" placeholder="Найти, например: orig" value="${esc(frState.f)}"><input type="text" id="frRepl" placeholder="Заменить на (пусто — удалить)" value="${esc(frState.r)}">
      <label><input type="checkbox" id="frRx" ${frState.rx?"checked":""}> регулярное выражение</label><button id="frPrev">Показать</button><button id="frOk" class="primary">Заменить</button><button id="frCancel">Закрыть</button>
      <div class="chk-res" id="frRes" style="flex-basis:100%"></div></div>`;
  if(mode==="main"&&chkState.total) html+=`<div class="bulk" style="background:var(--panel2)"><b>Проверка потоков:</b> ${chkState.done}/${chkState.total} · <span class="st-ok">✔ ${chkState.ok}</span> · <span class="st-bad">✖ ${chkState.bad}</span>
      ${chkState.done<chkState.total?`<button id="chkStop">Остановить</button>`:""}${chkState.bad?`<button id="chkHide">Скрыть нерабочие (${chkState.bad})</button><button id="chkSel">Выбрать нерабочие</button>`:""}<button id="chkClear">Убрать отметки</button></div>`;
  html+=list.length?list.map(c=>mode==="lists"?rowL(L,c):rowMain(c,opts)).join("")
    :`<div class="empty">${ST?(mode==="lists"&&!L?"Создайте плейлист в разделе «Объединённые плейлисты»":"Нет каналов"):""}</div>`;
  $("clist").innerHTML=html;
  renderBulk(opts);
  const gi=$("gRename"); if(gi) gi.onchange=()=>{setGr(sel,{rename:clean(gi.value)===sel?null:clean(gi.value)});render()};
  const ge=$("gEye"); if(ge) ge.onclick=()=>{setGr(sel,{hidden:!groupHidden(sel)});render()};
  const gu=$("gUnrename"); if(gu) gu.onclick=()=>{setGr(sel,{rename:null});render()};
  const ga=$("gAddCh"); if(ga) ga.onclick=()=>{addOpen=true;renderPane();$("acName").focus()};
  const gs2=$("gSort"); if(gs2) gs2.onclick=()=>{R.channel_order[sel]=chansOf(sel).slice().sort((a,b)=>dispName(a).localeCompare(dispName(b),"ru")).map(c=>c.k);render();toast("Каналы расставлены по алфавиту — «Сохранить и применить»")};
  const gu2=$("gUnsort"); if(gu2) gu2.onclick=()=>{delete R.channel_order[sel];render()};

  const gc=$("gCheck"); if(gc) gc.onclick=()=>runCheck(list.filter(c=>!chHidden(c)));
  const gf=$("gFr"); if(gf) gf.onclick=()=>{frOpen=!frOpen;renderPane();const f=$("frFind");if(f)f.focus()};
  const la=$("lAddAll"); if(la) la.onclick=()=>{list.filter(visMain).forEach(c=>setIn(L,c,true));render()};
  const lr=$("lRemAll"); if(lr) lr.onclick=()=>{list.forEach(c=>setIn(L,c,false));render()};
  $("showHidden").onchange=e=>{showHidden=e.target.checked;renderPane()};
  const qi=$("q"); qi.oninput=()=>{q=qi.value.trim().toLowerCase();checked.clear();openU=null;renderPane();const n=$("q");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  const ta=document.querySelector(".ued textarea"); if(ta){ta.focus()}
}
function nameHtml(c,eg){const dn=dispName(c);
  return `${c.alias?'<button class="sm unm" title="Снова сделать отдельным каналом">Расклеить</button> ':""}${esc(dn)}${dn!==c.n?`<small>(${esc(c.n)})</small>`:""}${(c.msrc||c.src).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}${c.msrc?`<span class="mod">склеено: ${ALL.filter(x=>x.alias===c.k).length+1}</span>`:""}${c.alias?`<span class="mod">склеен с «${esc(dispName(findC(c.alias)))}»</span>`:""}${q?`<small>· ${esc(dispG(eg))}</small>`:""}`}
const logoOf=c=>chRule(c.k).logo||c.logo;

        <label for="uLogo">Логотип</label><input type="text" id="uLogo" spellcheck="false" placeholder="${esc(c.logo||"ссылка на картинку")}" value="${esc(c.custom?(c.logo||""):(r.logo||""))}">

const isFree=v=>typeof v==="string"&&v.startsWith("f:");

    else{const gs=new Map(); r.channels.forEach(c=>{c.k=c.n.toLowerCase(); c.fk=src.free?`f:${src.id}:${c.k}`:null; if(!gs.has(c.g)) gs.set(c.g,[]); gs.get(c.g).push(c)});

function fgIn(L,id,g){return (L.fgroups||[]).includes(id+":"+g)}
function extPicked(L,x){if(x.fk){const id=x.fk.split(":")[1]; return !L.exclude.includes(x.fk)&&(L.channels.includes(x.fk)||fgIn(L,id,x.g))}
  const c=findC(x.k); return c?member(L,c):L.channels.includes(x.k)&&!L.exclude.includes(x.k)}
function setExt(L,x,on){if(x.fk){const id=x.fk.split(":")[1], gi=fgIn(L,id,x.g);
    if(on){pull(L.exclude,x.fk); if(!gi) push(L.channels,x.fk)} else{pull(L.channels,x.fk); if(gi) push(L.exclude,x.fk)} return}
  const c=findC(x.k); if(c) return setIn(L,c,on); if(on){push(L.channels,x.k);pull(L.exclude,x.k)} else pull(L.channels,x.k)}
function setExtGroup(L,g,on){const E=EXT[lsrc], ch=E.by.get(g)||[];
  if(isFree(lsrc)){const id=lsrc.slice(2), ks=new Set(ch.map(x=>x.fk)); L.fgroups=L.fgroups||[];
    L.channels=L.channels.filter(k=>!ks.has(k)); L.exclude=L.exclude.filter(k=>!ks.has(k)); if(on) push(L.fgroups,id+":"+g); else pull(L.fgroups,id+":"+g)}
  else ch.forEach(x=>setExt(L,x,on))}

    :`<div class="empty">${E&&E.chans?"Нет каналов":""}</div>`);
  $("xAddAll")&&($("xAddAll").onclick=()=>{list.forEach(x=>setExt(L,x,true));render()});

function freeRefs(L){return new Set([...L.channels,...L.exclude].filter(k=>k.startsWith("f:")).map(k=>k.split(":")[1]).concat((L.fgroups||[]).map(g=>g.split(":")[0])))}
function freeItems(L){const out=[]; let j=0;
  for(const id of freeRefs(L)){const f=freeById(id); if(!f) continue; const E=EXT["f:"+id];
    if(!E){loadExt("f:"+id,true); continue} if(!E.chans) continue;
    for(const x of E.chans) if(extPicked(L,x)) out.push({k:x.fk,n:x.n,g:f.name+" · "+x.g,logo:xLogo(x),i:2e6+(j++),free:true})}
  return out}
function mineItems(L){const ord=new Map((L.order||[]).map((k,i)=>[k,i]));
  const items=ALL.filter(c=>member(L,c)).map((c,i)=>({k:c.k,n:dispName(c),g:dispG(effGroup(c)),logo:logoOf(c),i}));
  const have=new Set(items.map(x=>x.k));
  L.channels.filter(k=>!k.startsWith("f:")&&!have.has(k)&&!findC(k)).forEach((k,j)=>{let x=null; for(const nm in EXT){const E=EXT[nm]; if(E.chans){x=E.chans.find(y=>y.k===k); if(x) break}}
    items.push({k,n:x?x.n:k,g:"ожидает применения",logo:x?x.logo:"",i:1e6+j,pend:true})});
  items.push(...freeItems(L));
  return items.sort((a,b)=>(ord.has(a.k)?ord.get(a.k):1e7+a.i)-(ord.has(b.k)?ord.get(b.k):1e7+b.i))}

  $("mlist").innerHTML=it.length?it.map((x,i)=>`<div class="m${x.pend?" pend":""}" draggable="true" data-mk="${esc(x.k)}"><span class="num">${L.chno?L.chno+i:i+1}</span>

/* ---------- проверка потоков ---------- */
async function runCheck(list){
  chkState={total:list.length,done:0,ok:0,bad:0,stop:false}; list.forEach(c=>delete chkRes[c.k]); renderPane();
  if(list.length>300&&!confirm("Проверить "+list.length+" каналов? Это займёт несколько минут.")){chkState.total=0;renderPane();return}
  let i=0;
  const worker=async()=>{while(i<list.length&&!chkState.stop){const c=list[i++]; const u=curUrls(c)[0]; let r;
    try{r=await (await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json","X-M3U-Editor":"1"},body:JSON.stringify({url:u})})).json()}catch(e){r={ok:false,msg:String(e)}}
    chkRes[c.k]=r; chkState.done++; r.ok?chkState.ok++:chkState.bad++;
    if(chkState.done%5===0||chkState.done===chkState.total) renderPane()}};
  await Promise.all([worker(),worker(),worker()]); renderPane();
  toast(chkState.stop?"Проверка остановлена":`Проверено ${chkState.done}: работают ${chkState.ok}, не отвечают ${chkState.bad}`)}

function frTargets(){return checked.size?[...checked].map(findC).filter(Boolean):paneList()}
function frApply(dry){const f=$("frFind").value, r=$("frRepl").value, rx=$("frRx").checked; frState={f,r,rx};
  if(!f){toast("Введите, что искать");return}
  let re; try{re=rx?new RegExp(f,"gi"):new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi")}catch(e){toast("Ошибка в выражении: "+e.message);return}
  const ch=[]; for(const c of frTargets()){const cur=dispName(c); const nn=clean(cur.replace(re,r)).replace(/\s{2,}/g," ").trim();
    if(nn&&nn!==cur) ch.push([c,cur,nn])}
  $("frRes").innerHTML=ch.length?ch.slice(0,30).map(([c,a,b])=>`<span>${esc(a)} → <b>${esc(b)}</b></span>`).join("")+(ch.length>30?`<span>…и ещё ${ch.length-30}</span>`:""):"Совпадений нет";
  if(dry||!ch.length) return;
  for(const [c,,nn] of ch){ if(c.custom) renameCustom(c,nn); else setCh(c.k,{rename:nn===c.n?null:nn}) }
  frOpen=false; render(); toast("Переименовано каналов: "+ch.length)}

let cChQ="", cChLim=150, cAddQ="", cPanel="";
function cChannels(c){const out=[], seen=new Set(), off=new Set(c.off||[]), urls=c.urls||{}, kid=g=>c.no_adult&&(g==="18+"||String(g).includes("18+"));
  for(const id of c.lists){const L=R.lists.find(x=>x.id===id); if(!L) continue;
    for(const ch of ALL){if(!member(L,ch)||seen.has(ch.k)) continue; const g=effGroup(ch); if(kid(g)) continue; seen.add(ch.k);
      out.push({k:ch.k,n:dispName(ch),g,kind:"list",from:L.name,src:(ch.u&&ch.u[0]&&ch.u[0][1])||""})}
    for(const f of freeItems(L)){if(seen.has(f.k)||kid(f.g)) continue; seen.add(f.k); out.push({k:f.k,n:f.n,g:f.g,kind:"list",from:L.name,src:""})}}
  for(const k of c.add||[]){const ch=findC(k); if(!ch||seen.has(k)) continue; const g=effGroup(ch); if(kid(g)) continue; seen.add(k);
    out.push({k,n:dispName(ch),g,kind:"add",from:"добавлен",src:(ch.u&&ch.u[0]&&ch.u[0][1])||""})}
  for(const x of c.extra||[]) out.push({k:"x:"+x.id,n:x.name,g:x.group,kind:"own",from:x.src?"файл: "+x.src:"свой",src:x.url,x});
  for(const r of out){r.on=!off.has(r.k); r.url=r.kind==="own"?r.x.url:(urls[r.k]||"")}
  const ORD=new Map((c.order||[]).map((k,i)=>[k,i])); if(ORD.size) out.sort((a,b)=>(ORD.get(a.k)??1e6)-(ORD.get(b.k)??1e6));   // свой порядок (перетаскивание)
  return out}

function parseM3U(text){const out=[]; let cur=null;
  for(const raw of String(text).replace(/\r/g,"").split("\n")){const l=raw.trim(); if(!l) continue;
    if(l.startsWith("#EXTINF")){const a={}; let rest=l.replace(/^#EXTINF:\s*-?\d+(\.\d+)?/,"").replace(/([\w-]+)="([^"]*)"/g,(m,k,v)=>{a[k.toLowerCase()]=v; return ""});
      const i=rest.indexOf(","); cur={name:(i>=0?rest.slice(i+1):"").trim()||a["tvg-name"]||"",group:a["group-title"]||"",logo:a["tvg-logo"]||""}}
    else if(l.startsWith("#EXTGRP:")&&cur&&!cur.group) cur.group=l.slice(8).trim();
    else if(l.startsWith("#")) continue;
    else if(cur){cur.url=l; out.push(cur); cur=null}}
  return out}

  if(!items.length){toast("Это не M3U-плейлист: не найдено ни одного канала (#EXTINF)");return}
  c.extra=c.extra||[]; const have=new Set(c.extra.map(x=>x.url)), src=clean(f.name.replace(/\.(m3u8?|txt)$/i,"")).slice(0,60)||"файл";
  let add=0, bad=0, dup=0, over=0;
  for(const it of items){const u=String(it.url||"").trim(), n=clean(it.name);
    if(!n||!URLRX.test(u)){bad++; continue} if(have.has(u)){dup++; continue} if(c.extra.length>=3000){over++; continue}

  cChQ=""; render();
  toast(`Из «${src}» добавлено ${plural(add,"канал","канала","каналов")}`+(dup?`, уже были: ${dup}`:"")+(bad?`, без ссылки: ${bad}`:"")+(over?`, не влезло (лимит 3000): ${over}`:"")+" — нажмите «Сохранить»")}

    document.body.appendChild(a); a.focus(); a.select(); let r=false; try{r=document.execCommand("copy")}catch(e){} a.remove();

    return `⚠️ <b>Просмотр здесь — это тоже поток к провайдеру.</b> HLS Proxy пускает не больше <b>${n||"?"}</b> каналов одновременно на все устройства вместе.${pv} Если сейчас на телевизорах уже смотрят ${n||"столько"} разных каналов, этот не откроется — закройте один из них. Тот же канал, что идёт на телевизоре, обычно отдельного потока не занимает. Закройте плеер, когда посмотрели, — поток освободится через несколько секунд.`}
  return `⚠️ <b>Просмотр здесь — ещё одно устройство для провайдера</b>${CONF.mode==="hls"?" (мимо HLS Proxy: канала нет в основном плейлисте)":""}.${pv} Если сейчас смотрят столько телевизоров, сколько разрешает провайдер, он может отключить просмотр — у Sharavoz, например, на всех устройствах на 15 минут. Закройте плеер, когда посмотрели.`}
function closePlayer(){if(!PLR) return; try{PLR.h&&PLR.h.destroy()}catch(e){} try{PLR.ts&&(PLR.ts.pause(),PLR.ts.unload(),PLR.ts.detachMediaElement(),PLR.ts.destroy())}catch(e){}
  const v=$("plV"); if(v){v.pause(); v.removeAttribute("src"); v.load()} $("plBox").hidden=true; PLR=null}
async function openPlayer(o){closePlayer();
  if(!$("plBox")) document.body.insertAdjacentHTML("beforeend",`<div id="plBox" class="plbox" hidden><div class="plwin" role="dialog" aria-label="Плеер">
    <div class="plhead"><b id="plT"></b><button id="plVlc" title="Скачать файл .m3u — он откроется в VLC">Открыть в VLC</button><button id="plCopy">Копировать ссылку</button><button id="plX" class="icon" title="Закрыть (Esc)">✕</button></div>
    <video id="plV" controls playsinline></video><div id="plS" class="plst"></div><div id="plI" class="plinfo"></div></div></div>`);
  PLR={name:o.name,url:null}; $("plT").textContent=o.name; $("plBox").hidden=false; plStatus("Ищу ссылку…");
  let url=o.url;
  if(o.main){try{const j=await (await fetch("/api/chanurl?n="+encodeURIComponent(o.name))).json(); if(j.url) url=j.url; else {url=o.fallback; o.direct=true}}catch(e){url=o.fallback; o.direct=true}}
  $("plI").innerHTML=limInfo(o);
  if(!PLR) return; PLR.url=url;
  if(!url){plStatus("У канала нет ссылки на поток",true); return}
  if(/\.mpd(\?|$)/i.test(url)){plStatus("Это поток DASH — браузер его не покажет. Нажмите «Открыть в VLC».",true); return}
  const src="/api/play?u="+encodeURIComponent(url), v=$("plV"); plStatus("Подключаюсь…");
  const tryTs=async()=>{if(!PLR) return; try{const M=await loadLib("mpegts.js","mpegts"); if(!M.getFeatureList().mseLivePlayback) throw 0;
      const p=M.createPlayer({type:"mpegts",isLive:true,url:location.origin+src},{enableStashBuffer:false}); PLR.ts=p; p.attachMediaElement(v); p.load(); v.play().catch(()=>{});
      p.on(M.Events.ERROR,()=>plStatus("Браузер не смог показать этот поток — нажмите «Открыть в VLC».",true)); plStatus("")}
    catch(e){plStatus("Браузер не смог показать этот поток — нажмите «Открыть в VLC».",true)}};
  try{const Hls=await loadLib("hls.min.js","Hls"); if(!PLR) return;
    if(Hls.isSupported()){const h=new Hls({maxBufferLength:20,manifestLoadingMaxRetry:1}); PLR.h=h; h.loadSource(src); h.attachMedia(v);
      h.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{}); plStatus("")});
      h.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal) return; let msg=""; try{msg=JSON.parse((d.networkDetails&&d.networkDetails.responseText)||"{}").error||""}catch(e){}
        h.destroy(); if(PLR) PLR.h=null;
        if(msg) plStatus("Не открылся: "+msg+". Можно попробовать «Открыть в VLC».",true);
        else if(d.details==="manifestParsingError") tryTs();   // не HLS — пробуем как поток TS
        else plStatus("Поток прервался ("+d.details+") — попробуйте ещё раз или «Открыть в VLC».",true)});
      return}
    if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=src; v.play().catch(()=>{}); plStatus(""); return}
  }catch(e){}
  tryTs()}
function plVlc(){if(!PLR||!PLR.url) return; const nm=PLR.name.replace(/[\\/:*?"<>|]+/g,"_").slice(0,60)||"канал";
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([`#EXTM3U\n#EXTINF:-1,${PLR.name}\n${PLR.url}\n`],{type:"audio/x-mpegurl"}));
  a.download=nm+".m3u"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  toast("Файл «"+nm+".m3u» скачан — откройте его, он запустится в VLC. Не забудьте закрыть VLC после просмотра — это тоже поток")}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="plX"||t.id==="plBox"){closePlayer();return} if(t.id==="plVlc"){plVlc();return} if(t.id==="plCopy"){PLR&&PLR.url&&copyText(PLR.url,"Ссылка на поток скопирована");return}
  if(!t.classList.contains("play")) return; e.stopImmediatePropagation(); e.preventDefault();
  const xr=t.closest("[data-xk]"), mr=t.closest("[data-k]");
  if(xr){const E=EXT[lsrc], x=E&&E.chans&&E.chans.find(y=>y.k===xr.dataset.xk); if(!x) return; const c=findC(x.k);
    if(c&&!isFree(lsrc)) openPlayer({name:dispName(c),main:true,fallback:x.u}); else openPlayer({name:x.n,url:x.u,free:isFree(lsrc),direct:true}); return}
  if(mr){const c=findC(mr.dataset.k); if(!c) return; const us=curUrls(c); openPlayer({name:dispName(c),main:true,fallback:(us&&us[0])||(c.u&&c.u[0]&&c.u[0][1])})}},true);
document.addEventListener("keydown",e=>{if(e.key!=="Escape") return; if(PLR) closePlayer(); else if($("pvBox")&&!$("pvBox").hidden) closePreview()});
/* ---------- «Каналы ›» у источника: фильтр в «Группах и каналах» или предпросмотр ---------- */
function setSrcF(n){srcF=n; checked.clear(); openU=null;
  if(srcF){const gs=groupsOrdered(); if(!sel||!chansOf(sel).some(inSrcF)) sel=gs.find(g=>chansOf(g).some(inSrcF))||sel}
  render()}
function openSourceChannels(x){const loaded=ALL.some(c=>(c.msrc||c.src||[]).includes(x.name));
  if(loaded){flt=""; q=""; mode="main"; try{localStorage.setItem("m3uePage","main")}catch(e){} setSrcF(x.name); scrollTo(0,0); return}
  previewSource(x)}
let PV=null;
function closePreview(){const b=$("pvBox"); if(b) b.hidden=true; PV=null}
function pvKey(c){return PV.free?`f:${PV.fid}:${c.n.toLowerCase()}`:c.n.toLowerCase()}
function pvEd(c){const k=pvKey(c); if(PV.free) return FE(k); const r=chRule(k); return {url:r.urls&&r.urls[0],logo:r.logo}}
async function previewSource(x,free){
  if(!$("pvBox")) document.body.insertAdjacentHTML("beforeend",`<div id="pvBox" class="plbox" style="z-index:55" hidden><div class="plwin" style="width:min(900px,100%)" role="dialog" aria-label="Что внутри источника"><div id="pvIn"></div></div></div>`);
  PV={name:x.name,url:x.url,free:!!free,fid:x.fid||"",loading:true,ed:null}; $("pvBox").hidden=false; renderPreview();
  try{const j=await (await fetch("/api/fetch",{method:"POST",headers:{"Content-Type":"application/json","X-M3U-Editor":"1"},body:JSON.stringify({url:x.url})})).json();
    if(!PV||PV.url!==x.url) return;
    if(j.error){PV.error=j.error} else {const by=new Map(); for(const c of j.channels){if(!by.has(c.g)) by.set(c.g,[]); by.get(c.g).push(c)} PV.by=by; PV.count=j.count; PV.sel=[...by.keys()][0]; PV.q=""}}
  catch(e){if(PV) PV.error=String(e)}
  if(PV){PV.loading=false; renderPreview()}}
function renderPreview(){if(!PV) return; const head=`<div class="plhead"><b>${esc(PV.name)} — что внутри</b><span class="badge">${PV.free?"отдельный плейлист":"ещё не применён"}</span><button id="pvX" class="icon" title="Закрыть (Esc)">✕</button></div>`;
  if(PV.loading){$("pvIn").innerHTML=head+`<p class="hint">Загружаю ${PV.free?"плейлист":"плейлист источника"}…</p>`; return}
  if(PV.error){$("pvIn").innerHTML=head+`<p class="hint st-bad">Не удалось загрузить: ${esc(PV.error)}</p><div style="display:flex;justify-content:flex-end"><button id="pvClose">Закрыть</button></div>`; return}
  const gs=[...PV.by.keys()], q=(PV.q||"").toLowerCase();
  const list=q?[].concat(...PV.by.values()).filter(c=>c.n.toLowerCase().includes(q)):(PV.by.get(PV.sel)||[]);
  $("pvIn").innerHTML=head+`<p class="hint" style="margin:0 0 10px">${PV.free?`Эти каналы не входят в основной плейлист — их можно взять в свои плейлисты: «Объединённые плейлисты» → «Откуда брать каналы». Внутри <b>${PV.count} каналов в ${gs.length} группах</b>.`:`Источник добавлен, но его каналов ещё нет в основном плейлисте. Это предпросмотр: <b>${PV.count} каналов в ${gs.length} группах</b>.`}</p>
    <div class="pvgrid"><div>${gs.map(g=>`<div class="pvg${!q&&g===PV.sel?" on":""}" data-pvg="${esc(g)}"><span>${esc(g)}</span><span class="muted">${PV.by.get(g).length}</span></div>`).join("")}</div>
    <div><div style="padding:8px 12px;border-bottom:1px solid var(--line)"><input type="search" id="pvQ" placeholder="Поиск по всем группам" value="${esc(PV.q||"")}" style="width:100%"></div>
    ${list.slice(0,500).map((c,i)=>{const ed=pvEd(c), lg=ed.logo||c.logo, k=pvKey(c);
      return `<div class="pvc">${lg?`<img loading="lazy" src="${esc(lg)}" alt="" onerror="this.style.visibility='hidden'">`:'<span class="nl"></span>'}<span>${esc(c.n)}${ed.url?'<span class="mod">своя ссылка</span>':""}${ed.logo?'<span class="mod">свой логотип</span>':""}${q?` <small class="muted">${esc(c.g)}</small>`:""}</span><button class="icon pved" data-i="${i}" title="Изменить ссылку и логотип">✎</button>${c.u||ed.url?`<button class="icon pvplay" data-i="${i}" title="Смотреть канал">▶</button>`:"<span></span>"}</div>`
       +(PV.ed===k?`<div class="pvedit" data-i="${i}"><div class="ufields">
          <label for="pvU">Ссылка на поток</label><input type="text" id="pvU" spellcheck="false" value="${esc(ed.url||"")}" placeholder="${esc(c.u||"http(s)://…")}">
          <label for="pvL">Логотип</label><input type="text" id="pvL" spellcheck="false" value="${esc(ed.logo||"")}" placeholder="${esc(c.logo||"ссылка на картинку")}"></div>
          <div class="uhint">Пустое поле — остаётся исходное. ${PV.free?"Вступит в силу после «Сохранить»: ваши плейлисты обновятся через несколько секунд. Когда плейлист сам обновляется раз в 6 часов, ваша правка остаётся.":"Вступит в силу после «Сохранить и применить». Своя ссылка заменит ссылки этого канала из всех источников."}</div>
          <div class="ubtns"><button data-pve="ok" class="primary">Готово</button>${ed.url||ed.logo?'<button data-pve="orig">Вернуть исходные</button>':""}<button data-pve="cancel">Отмена</button></div></div>`:"")}).join("")||'<div class="empty">Ничего не найдено</div>'}
    ${list.length>500?'<div class="empty">показаны первые 500 — уточните поиском</div>':""}</div></div>
    ${PV.free?`<div class="pvwarn" style="background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.35)">ℹ️ ▶ играет напрямую с сайта канала — лимит вашего провайдера не тратит. Бесплатные ссылки проверяются раз в 6 часов, но отдельные каналы всё равно могут не открыться или прерываться.</div>`:`<div class="pvwarn">⚠️ <b>▶ здесь играет напрямую у провайдера${CONF.mode==="hls"?", мимо HLS Proxy":""}</b> — это ещё одно устройство, и лимит HLS Proxy его не сдерживает. Если сейчас смотрят столько телевизоров, сколько разрешает провайдер, он может отключить просмотр на всех (у Sharavoz — на 15 минут). Смотрите коротко и закрывайте плеер.</div>`}
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px"><button id="pvClose">Закрыть</button>${PV.free?`<button id="pvLists" class="primary">Взять в свой плейлист ›</button>`:`<button id="pvApply" class="primary">Сохранить и применить — добавить в основной</button>`}</div>`;
  PV.list=list; const qi=$("pvQ"); qi.oninput=()=>{PV.q=qi.value; const pos=qi.selectionStart; renderPreview(); const n=$("pvQ"); n.focus(); n.setSelectionRange(pos,pos)}}
document.addEventListener("click",e=>{const t=e.target; if(!PV) return;
  if(t.id==="pvBox"||t.id==="pvX"||t.id==="pvClose"){closePreview();return}
  if(t.id==="pvApply"){closePreview(); save(true); return}
  if(t.id==="pvLists"){closePreview(); mode="plist"; try{localStorage.setItem("m3uePage","plist")}catch(e){} render(); scrollTo(0,0); toast("Откройте свой плейлист (или создайте новый) → «Откуда брать каналы» → выберите этот плейлист"); return}
  const g=t.closest("[data-pvg]"); if(g){PV.sel=g.dataset.pvg; PV.q=""; renderPreview(); return}
  if(t.classList.contains("pvplay")){const c=PV.list[+t.dataset.i]; if(c) openPlayer({name:c.n,url:pvEd(c).url||c.u,direct:true}); e.stopImmediatePropagation(); return}
  if(t.classList.contains("pved")){const c=PV.list[+t.dataset.i]; if(c){const k=pvKey(c); PV.ed=PV.ed===k?null:k; renderPreview(); const u=$("pvU"); if(u){u.closest(".pvedit").scrollIntoView({block:"nearest"}); u.focus()}} e.stopImmediatePropagation(); return}
  const pa=t.dataset&&t.dataset.pve; if(pa){const box=t.closest(".pvedit"), c=box&&PV.list[+box.dataset.i]; e.stopImmediatePropagation(); if(!c) return; const k=pvKey(c);
    if(pa==="cancel"){PV.ed=null; renderPreview(); return}
    let u=pa==="orig"?"":$("pvU").value.trim(), lg=pa==="orig"?"":$("pvL").value.trim();
    if(u&&!URLRX.test(u)){toast("Ссылка на поток должна начинаться с http://, https://, rtmp:// или udp://");return}
    if(lg&&!/^https?:\/\/[^\s"]{1,2000}$/i.test(lg)){toast("Логотип — ссылка http(s)://… на картинку");return}
    if(u===c.u) u=""; if(lg===c.logo) lg="";
    if(PV.free){const n={}; if(u) n.url=u; if(lg) n.logo=lg; if(Object.keys(n).length) R.free_edits[k]=n; else delete R.free_edits[k]}
    else setCh(k,{urls:u?[u]:null,logo:lg||null});
    PV.ed=null; markDirty(); renderPreview(); toast(PV.free?"Готово — нажмите «Сохранить»":"Готово — нажмите «Сохранить и применить»")}},true);
document.addEventListener("click",e=>{if(e.target.id==="srcFClear") setSrcF(null)});
load().catch(e=>{$("stats").textContent="Ошибка загрузки: "+e});
