<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evgen4ik TV — вход</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f59e0b'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-weight='800' font-size='14' fill='%2318181b'%3EE4%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#09090b;--panel:#18181b;--ink:#fafafa;--muted:#a1a1aa;--line:rgba(255,255,255,.09);--accent:#f59e0b;--accent-ink:#18181b;--bad:#f87171;--bad-soft:rgba(248,113,113,.12);--f:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f9fafb;--panel:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#d97706;--accent-ink:#fff;--bad:#dc2626;--bad-soft:#fee2e2;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;letter-spacing:-.01em;margin-bottom:6px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:800}
.tv{color:var(--accent)}
p{color:var(--muted);margin:0 0 20px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{margin-top:14px;padding:9px 12px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font-size:13px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="brand"><span class="logo">E4</span><span>Evgen4ik<span class="tv"> TV</span></span></div>
  <p>Редактор плейлистов</p>
  <label for="u">Логин</label><input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Пароль</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Войти</button>
  <div class="err" id="e" hidden></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const b = document.getElementById("b"), e = document.getElementById("e");
  b.disabled = true; e.hidden = true;
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json", "X-M3U-Editor": "1"},
      body: JSON.stringify({user: document.getElementById("u").value, password: document.getElementById("p").value})});
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.href = "/"; return; }
    e.textContent = j.error || ("Ошибка " + r.status); e.hidden = false;
  } catch (x) { e.textContent = "Сервер не отвечает"; e.hidden = false; }
  b.disabled = false;
});
</script>
</body>
</html>
